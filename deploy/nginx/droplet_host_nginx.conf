# =========================================================================
# DIGITALOCEAN DROPLET HOST NGINX CONFIGURATION
# =========================================================================
# Use this file if your DigitalOcean Droplet already has Nginx running
# on bare metal (/etc/nginx/sites-available/pos_techzu.conf).
#
# Docker Compose should bind ports to 127.0.0.1 (localhost only):
#   - Backend: 127.0.0.1:5006:5006
#   - Admin:   127.0.0.1:3004:80
# The host Nginx acts as the public reverse proxy handling SSL, domains, and gzip.

# -------------------------------------------------------------------------
# OPTION 1: SUBDOMAIN SETUP (Recommended for Production with SSL)
# -------------------------------------------------------------------------
# Frontend: pos-techzu.codernex.dev     -> Proxies to 127.0.0.1:3004 (Docker pos_admin)
# Backend:  api-pos-techzu.codernex.dev -> Proxies to 127.0.0.1:5006 (Docker pos_backend)

# Backend API Subdomain
server {
    listen 80;
    server_name api-pos-techzu.codernex.dev;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;

        # WebSockets and Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Real Client IP and Protocol headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Frontend Admin Portal Subdomain
server {
    listen 80;
    server_name pos-techzu.codernex.dev;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

